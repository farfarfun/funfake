[project]
name = "funfake"
version = "1.1.6"
description = "A lightweight Python library for generating realistic HTTP headers, Chinese and English names, and Chinese and US phone numbers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = []
[[project.authors]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.authors]]
name = "farfarfun"
email = "farfarfun@qq.com"

[[project.maintainers]]
name = "牛哥"
email = "niuliangtao@qq.com"

[[project.maintainers]]
name = "farfarfun"
email = "farfarfun@qq.com"

[project.urls]
Organization = "https://github.com/farfarfun"
Repository = "https://github.com/farfarfun/funfake"
Releases = "https://github.com/farfarfun/funfake/releases"

[tool.setuptools]
license-files = ["LICENSE"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/funfake"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "ruff>=0.16",
]

[tool.ruff]
target-version = "py310"
src = ["src"]
# 请求头模拟数据里有真实的浏览器 UA 字符串（如 Opera 的 OPR 版本号后缀），
# 行长度比默认的 88 更长，调宽到 120 避免为了凑行宽截断数据。
line-length = 120
# README 里的代码示例是给人读的，交给格式化器会被压扁（如对齐的行尾注释被收紧），不纳入格式化范围。
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # RUF001-003：注释与报错信息使用中文，全角标点属于有意为之，不算易混淆字符问题。
    "RUF001",
    "RUF002",
    "RUF003",
    # RUF012：BaseGenerator 子类用 list/dict 类属性声明姓名、手机号段等常量数据，
    # 只读不在实例间共享可变状态，不是真正的“可变默认值”陷阱。
    "RUF012",
]
